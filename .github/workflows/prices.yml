name: Update prices

run-name: ${{ github.event.inputs.mode == 'dispatch-test' && 'prices dispatch-test' || format('prices loop ({0})', github.event_name) }}

on:
  schedule:
    # Backup kick-start only. A live run dispatches its own successor, so the
    # chain no longer depends on these ticks. Both opens stay on the calendar
    # because GitHub cron is UTC: 13:30 in summer (EDT) and 14:30 in winter (EST).
    - cron: "25 13 * * 1-5"
    - cron: "25 14 * * 1-5"
    - cron: "*/5 13-22 * * 1-5"
    - cron: "0 23 * * 1-5"
    - cron: "0 13-23 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "loop keeps the chain; dispatch-test publishes nothing and only checks the handoff"
        required: false
        default: loop
        type: choice
        options:
          - loop
          - dispatch-test
  push:
    paths:
      - .github/workflows/prices.yml
      - scripts/update-prices.mjs
      - scripts/poll-prices.sh
      - scripts/dispatch-next.mjs
      - scripts/market-calendar.mjs

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.event.inputs.mode == 'dispatch-test' && format('prices-probe-{0}', github.run_id) || 'prices-loop' }}
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh prices until the next handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRICE_MODE: ${{ github.event.inputs.mode != '' && github.event.inputs.mode || 'loop' }}
          PRICE_ARM_PROBE: ${{ github.event_name == 'push' && '1' || '' }}
        run: bash scripts/poll-prices.sh

      - name: Dispatch the next run
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dispatch-next.mjs --mode loop
