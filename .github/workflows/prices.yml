name: Update prices

on:
  schedule:
    # Backup starts only. GitHub often delays or drops these ticks, so a started run keeps polling itself.
    # Weekdays 13:00–21:55 UTC every 5 minutes, 22:00 UTC, and every hour 12:00–22:00 UTC.
    - cron: "*/5 13-21 * * 1-5"
    - cron: "0 22 * * 1-5"
    - cron: "0 12-22 * * 1-5"
  workflow_dispatch:
  # workflow_dispatch is blocked for the integration token, so pushing these files starts a run.
  push:
    paths:
      - .github/workflows/prices.yml
      - scripts/update-prices.mjs
      - scripts/poll-prices.sh

permissions:
  contents: write
  actions: read

concurrency:
  group: prices-data
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh prices through the session
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/poll-prices.sh
