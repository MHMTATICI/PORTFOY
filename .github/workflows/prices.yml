name: Update prices

on:
  schedule:
    # GitHub cron is UTC and does not follow US daylight saving time, so both opens are listed.
    # Regular session: 13:30–20:00 UTC while New York is on EDT, 14:30–21:00 UTC on EST.
    # A run that starts in premarket keeps polling; a second start exits if a loop is already active.
    - cron: "25 13 * * 1-5"
    - cron: "25 14 * * 1-5"
    - cron: "*/5 13-22 * * 1-5"
    - cron: "0 23 * * 1-5"
    - cron: "0 13-23 * * 1-5"
  workflow_dispatch:
  # workflow_dispatch is blocked for the integration token, so pushing these files starts a run.
  push:
    paths:
      - .github/workflows/prices.yml
      - scripts/update-prices.mjs
      - scripts/poll-prices.sh

permissions:
  contents: write
  actions: read

concurrency:
  group: prices-data
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh prices through the session
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/poll-prices.sh
